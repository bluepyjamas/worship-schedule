<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tacloban Worship Team Schedule</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --bg: #f4f1ea; --surface: #fffdf8; --ink: #1d2521; --muted: #646c66;
    --line: #e0d9cb; --accent: #8a6522; --green: #244235; --green-2: #2f5546; --on-green: #f4f1ea;
    --shadow: 0 1px 2px rgba(29,37,33,.06), 0 8px 24px rgba(29,37,33,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #121815; --surface: #19211d; --ink: #ebe6d9; --muted: #98a29b;
      --line: #2b3832; --accent: #d1a65a; --green: #2f5546; --green-2: #3b6352; --on-green: #f3efe4;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #121815; --surface: #19211d; --ink: #ebe6d9; --muted: #98a29b;
    --line: #2b3832; --accent: #d1a65a; --green: #2f5546; --green-2: #3b6352; --on-green: #f3efe4;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
  }
  :root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  *, *::before, *::after { box-sizing: inherit; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0; min-height: 100%; background: var(--bg); color: var(--ink);
    font-family: Figtree, system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 16px; line-height: 1.55; -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3 { font-family: "Cormorant Garamond", Georgia, serif; font-weight: 600; margin: 0; line-height: 1.1; }
  p { margin: 0; }

  /* Hero */
  .hero { position: relative; height: clamp(300px, 46vh, 460px); overflow: hidden; background: var(--green); }
  .hero img { width: 100%; height: 100%; object-fit: cover; object-position: center 60%; display: block; }
  .hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(13,24,19,.15) 0%, rgba(13,24,19,.78) 100%); }
  .hero-text { position: absolute; left: 0; right: 0; bottom: 0; z-index: 1; padding: 0 20px 36px; max-width: 980px; margin: 0 auto; color: #fbf8f1; }
  .hero h1 { font-size: clamp(2.4rem, 6vw, 3.6rem); margin-bottom: 8px; text-shadow: 0 2px 18px rgba(0,0,0,.25); }
  .hero .sub { font-size: 1.02rem; opacity: .92; max-width: 56ch; }
  .hero-credit { position: absolute; right: 16px; bottom: 10px; z-index: 1; font-size: .72rem; color: rgba(255,255,255,.75); }

  /* Layout */
  .wrap { max-width: 880px; margin: 0 auto; padding: 0 20px 72px; }
  .panel {
    background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow);
    padding: 24px; margin-top: -44px; position: relative; z-index: 2;
    display: grid; grid-template-columns: 1fr auto; gap: 16px 28px; align-items: end;
  }
  .panel label { display: block; font-size: .85rem; font-weight: 600; color: var(--muted); margin-bottom: 8px; }
  .select-wrap { position: relative; }
  .select-wrap::after {
    content: ""; position: absolute; right: 18px; top: 50%; width: 8px; height: 8px;
    border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted);
    transform: translateY(-70%) rotate(45deg); pointer-events: none;
  }
  select {
    width: 100%; appearance: none; -webkit-appearance: none; font: inherit; font-size: 1.05rem;
    padding: 14px 46px 14px 16px; border: 1px solid var(--line); border-radius: 4px;
    background: var(--bg); color: var(--ink); cursor: pointer;
  }
  select:hover { border-color: var(--muted); }
  select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .panel-note { color: var(--muted); font-size: .92rem; max-width: 30ch; }

  #results { margin-top: 40px; }
  #results[hidden] { display: none; }
  .person-head {
    display: flex; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; gap: 8px 16px;
    padding-bottom: 14px; border-bottom: 2px solid var(--ink); margin-bottom: 4px;
  }
  .person-head h2 { font-size: 2.1rem; }
  .count { color: var(--muted); font-size: .92rem; font-weight: 600; }

  .service {
    display: grid; grid-template-columns: 104px 1fr; gap: 28px; padding: 28px 0;
    border-bottom: 1px solid var(--line);
  }
  .date {
    background: var(--green); color: var(--on-green); text-align: center; padding: 18px 8px;
    align-self: start; border-radius: 4px;
  }
  .date .dow { display: block; font-size: .78rem; font-weight: 600; opacity: .9; }
  .date .day { display: block; font-family: "Cormorant Garamond", Georgia, serif; font-size: 2.8rem; line-height: 1; font-weight: 600; margin: 6px 0 4px; }
  .date .mon { display: block; font-size: .88rem; }
  .service-title { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; }
  .service h3 { font-size: 1.5rem; }
  .next-tag {
    font-size: .72rem; font-weight: 700; letter-spacing: .02em;
    background: var(--accent); color: var(--surface); padding: 3px 10px; border-radius: 999px;
  }
  .time { color: var(--muted); margin: 4px 0 18px; font-size: .95rem; }
  .role {
    display: flex; align-items: baseline; gap: 10px; padding: 12px 14px; margin: 0 0 6px;
    background: var(--bg); border-left: 3px solid var(--accent); border-radius: 2px;
  }
  .role .k { color: var(--muted); font-size: .88rem; }
  .role strong { font-weight: 700; }
  h4 { font-size: .85rem; color: var(--muted); font-weight: 600; margin: 20px 0 8px; }
  .team { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 6px 24px; }
  .team li { display: flex; flex-direction: column; }
  .team span { color: var(--muted); font-size: .8rem; }
  .team li { font-weight: 500; }
  .songs { margin: 0; padding-left: 1.5em; display: grid; gap: 4px; }
  .songs li { padding-left: 4px; }
  .songs li::marker { color: var(--accent); font-weight: 700; }
  .muted { color: var(--muted); font-size: .95rem; }
  .empty {
    padding: 36px 24px; border: 1px dashed var(--line); border-radius: 4px; color: var(--muted);
    text-align: center; margin-top: 12px; background: var(--surface);
  }

  footer {
    margin-top: 56px; padding-top: 20px; border-top: 1px solid var(--line);
    color: var(--muted); font-size: .85rem; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px;
  }

  @media (max-width: 640px) {
    .panel { grid-template-columns: 1fr; margin-top: -36px; padding: 18px; }
    .service { grid-template-columns: 1fr; gap: 16px; padding: 22px 0; }
    .date { display: flex; gap: 10px; align-items: baseline; justify-content: flex-start; text-align: left; padding: 10px 14px; }
    .date .day { font-size: 2.1rem; margin: 0; }
    .team { grid-template-columns: 1fr; }
  }
  @media (prefers-reduced-motion: no-preference) {
    #results:not([hidden]) { animation: rise .4s ease-out; }
  }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
</style>
</head>

const ROLE_ORDER = ['vx', 'bv1', 'bv2', 'eg', 'ag', 'dr', 'kb', 'bb'];
const ROLE_LABEL = {
  vx: 'Worship Leader', bv1: 'Back-up Vocals 1', bv2: 'Back-up Vocals 2',
  eg: 'Electric Guitar', ag: 'Acoustic Guitar', dr: 'Drums', kb: 'Keyboard', bb: 'Bass Guitar'
};

const today = (() => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); })();

function el(tag, attrs, ...kids) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null) continue;
    if (k === 'class') node.className = v; else node.setAttribute(k, v);
  }
  for (const c of kids.flat()) {
    if (c == null || c === false) continue;
    node.append(c.nodeType ? c : document.createTextNode(String(c)));
  }
  return node;
}

function parseDate(iso) { const [y, m, d] = iso.split('-').map(Number); return new Date(y, m - 1, d); }
function fmtLong(dt) { return dt.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' }); }
function fmtTime(t) {
  const [h, m] = t.split(':').map(Number);
  return `${((h + 11) % 12) + 1}:${String(m).padStart(2, '0')} ${h >= 12 ? 'PM' : 'AM'}`;
}
function rolesFor(service, name) { return ROLE_ORDER.filter(k => service.team[k] === name); }

function card(s, name, isNext) {
  const dt = parseDate(s.date);
  const mine = rolesFor(s, name).map(k => ROLE_LABEL[k]).join(' & ');
  const others = ROLE_ORDER
    .filter(k => s.team[k] && s.team[k] !== name)
    .map(k => el('li', {}, el('span', {}, ROLE_LABEL[k]), s.team[k]));
  const songs = s.songs.map(t => el('li', {}, t));

  return el('article', { class: 'service' },
    el('div', { class: 'date' },
      el('span', { class: 'dow' }, dt.toLocaleDateString('en-US', { weekday: 'short' })),
      el('span', { class: 'day' }, String(dt.getDate())),
      el('span', { class: 'mon' }, dt.toLocaleDateString('en-US', { month: 'long' }))),
    el('div', {},
      el('div', { class: 'service-title' },
        el('h3', {}, s.label),
        isNext ? el('span', { class: 'next-tag' }, 'Next service') : null),
      el('p', { class: 'time' }, `${fmtTime(s.time)}  ·  ${fmtLong(dt)}`),
      el('p', { class: 'role' }, el('span', { class: 'k' }, 'Your role'), el('strong', {}, mine)),
      el('h4', {}, 'Serving with'),
      others.length ? el('ul', { class: 'team' }, others) : el('p', { class: 'muted' }, 'No other team members listed yet.'),
      el('h4', {}, 'Setlist'),
      songs.length ? el('ol', { class: 'songs' }, songs) : el('p', { class: 'muted' }, 'Setlist not added yet.')
    )
  );
}

function render(name) {
  const out = document.getElementById('results');
  out.replaceChildren();
  if (!name) { out.hidden = true; return; }
  out.hidden = false;

  const mine = DATA.services.filter(s => rolesFor(s, name).length);
  const upcoming = mine.filter(s => parseDate(s.date) >= today);

  out.append(el('div', { class: 'person-head' },
    el('h2', {}, name),
    el('p', { class: 'count' }, upcoming.length
      ? `${upcoming.length} upcoming service${upcoming.length > 1 ? 's' : ''}`
      : 'No upcoming services')));

  if (!mine.length) {
    out.append(el('div', { class: 'empty' }, 'You are not on any service in the lineup yet. Check back once the coordinator publishes the schedule.'));
  } else if (!upcoming.length) {
    out.append(el('div', { class: 'empty' }, 'You have no upcoming services. Past services are no longer listed here.'));
  } else {
    upcoming.forEach((s, i) => out.append(card(s, name, i === 0)));
  }
}

(function init() {
  const sel = document.getElementById('name');
  DATA.people.forEach(n => sel.append(el('option', { value: n }, n)));
  sel.addEventListener('change', e => render(e.target.value));
  document.getElementById('asof').textContent = parseDate(DATA.asOf).toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
})();
