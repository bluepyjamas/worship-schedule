<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Victory Tacloban Worship Team Schedule</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --bg: #f4f1ea; --surface: #fffdf8; --ink: #1d2521; --muted: #646c66;
    --line: #e0d9cb; --accent: #8a6522; --green: #244235; --green-2: #2f5546; --on-green: #f4f1ea;
    --danger: #9b2c2c;
    --shadow: 0 1px 2px rgba(29,37,33,.06), 0 8px 24px rgba(29,37,33,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #121815; --surface: #19211d; --ink: #ebe6d9; --muted: #98a29b;
      --line: #2b3832; --accent: #d1a65a; --green: #2f5546; --green-2: #3b6352; --on-green: #f3efe4;
      --danger: #e08a8a;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #121815; --surface: #19211d; --ink: #ebe6d9; --muted: #98a29b;
    --line: #2b3832; --accent: #d1a65a; --green: #2f5546; --green-2: #3b6352; --on-green: #f3efe4;
    --danger: #e08a8a;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
  }
  :root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  *, *::before, *::after { box-sizing: inherit; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0; min-height: 100%; background: var(--bg); color: var(--ink);
    font-family: Figtree, system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 16px; line-height: 1.55; -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3 { font-family: "Cormorant Garamond", Georgia, serif; font-weight: 600; margin: 0; line-height: 1.1; }
  p { margin: 0; }
  button { font: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ---------- Hero carousel ---------- */
  .hero { position: relative; height: clamp(320px, 50vh, 500px); overflow: hidden; background: var(--green); }
  .slide { position: absolute; inset: 0; opacity: 0; transition: opacity .8s ease; }
  .slide.on { opacity: 1; }
  .slide img { width: 100%; height: 100%; object-fit: cover; object-position: center 55%; display: block; }
  .hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(13,24,19,.45) 0%, rgba(13,24,19,.05) 28%, rgba(13,24,19,.8) 100%); pointer-events: none; }

  .topbar { position: absolute; top: env(safe-area-inset-top, 0px); left: 0; right: 0; z-index: 3; padding: 14px 20px; max-width: 980px; margin: 0 auto; display: flex; align-items: center; }
  .brand { display: inline-flex; align-items: center; gap: 10px; background: var(--surface); color: var(--ink); padding: 6px 14px 6px 10px; border-radius: 999px; box-shadow: var(--shadow); text-decoration: none; min-height: 44px; }
  .brand img { height: 32px; width: auto; max-width: 140px; display: block; }
  .brand .wordmark { font-family: "Cormorant Garamond", Georgia, serif; font-weight: 700; font-size: 1.35rem; letter-spacing: .01em; line-height: 1; }
  .brand .wordmark[hidden], .brand img[hidden] { display: none; }

  .hero-text { position: absolute; left: 0; right: 0; bottom: 0; z-index: 2; padding: 0 20px 62px; max-width: 980px; margin: 0 auto; color: #fbf8f1; }
  .hero h1 { font-size: clamp(2.4rem, 6vw, 3.6rem); margin-bottom: 8px; text-shadow: 0 2px 18px rgba(0,0,0,.25); }
  .hero .sub { font-size: 1.02rem; opacity: .92; max-width: 56ch; }

  .nav { position: absolute; top: 50%; transform: translateY(-50%); z-index: 3; width: 44px; height: 44px; border-radius: 50%; border: 0; background: rgba(251,248,241,.9); color: #1d2521; cursor: pointer; display: grid; place-items: center; }
  .nav:hover { background: #fff; }
  .nav.prev { left: 12px; } .nav.next { right: 12px; }
  .nav svg { width: 20px; height: 20px; }
  .carousel-foot { position: absolute; z-index: 3; left: 0; right: 0; bottom: 56px; max-width: 980px; margin: 0 auto; padding: 0 20px; display: flex; justify-content: flex-end; align-items: center; gap: 14px; pointer-events: none; }
  .caption { color: rgba(255,255,255,.85); font-size: .78rem; }
  .dots { display: flex; gap: 4px; pointer-events: auto; }
  .dot { width: 24px; height: 24px; border: 0; background: none; padding: 0; cursor: pointer; display: grid; place-items: center; }
  .dot::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: rgba(255,255,255,.5); transition: background .2s, width .2s; }
  .dot[aria-current="true"]::before { background: #fff; width: 22px; border-radius: 6px; }

  /* ---------- Layout ---------- */
  .wrap { max-width: 880px; margin: 0 auto; padding: 0 20px 72px; }
  .panel {
    background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow);
    padding: 24px; margin-top: -44px; position: relative; z-index: 4;
    display: grid; grid-template-columns: 1fr auto; gap: 16px 28px; align-items: end;
  }
  .panel label { display: block; font-size: .85rem; font-weight: 600; color: var(--muted); margin-bottom: 8px; }
  .select-wrap { position: relative; }
  .select-wrap::after {
    content: ""; position: absolute; right: 18px; top: 50%; width: 8px; height: 8px;
    border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted);
    transform: translateY(-70%) rotate(45deg); pointer-events: none;
  }
  select {
    width: 100%; appearance: none; -webkit-appearance: none; font: inherit; font-size: 1.05rem;
    padding: 14px 46px 14px 16px; border: 1px solid var(--line); border-radius: 4px;
    background: var(--bg); color: var(--ink); cursor: pointer;
  }
  select:hover { border-color: var(--muted); }
  .panel-note { color: var(--muted); font-size: .92rem; max-width: 30ch; }

  /* ---------- Tabs ---------- */
  .tabs { display: flex; gap: 4px; margin-top: 32px; border-bottom: 2px solid var(--ink); }
  .tab { padding: 12px 20px; background: none; border: 0; border-bottom: 3px solid transparent; margin-bottom: -2px; font-weight: 600; color: var(--muted); cursor: pointer; }
  .tab:hover { color: var(--ink); }
  .tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }

  #view { margin-top: 24px; min-height: 160px; }

  /* ---------- Schedule list ---------- */
  .person-head { display: flex; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; gap: 8px 16px; padding-bottom: 14px; border-bottom: 1px solid var(--line); margin-bottom: 4px; }
  .person-head h2 { font-size: 2.1rem; }
  .count { color: var(--muted); font-size: .92rem; font-weight: 600; }
  .service { display: grid; grid-template-columns: 104px 1fr; gap: 28px; padding: 28px 0; border-bottom: 1px solid var(--line); }
  .date { background: var(--green); color: var(--on-green); text-align: center; padding: 18px 8px; align-self: start; border-radius: 4px; }
  .date .dow { display: block; font-size: .78rem; font-weight: 600; opacity: .9; }
  .date .day { display: block; font-family: "Cormorant Garamond", Georgia, serif; font-size: 2.8rem; line-height: 1; font-weight: 600; margin: 6px 0 4px; }
  .date .mon { display: block; font-size: .88rem; }
  .service-title { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; }
  .service h3 { font-size: 1.5rem; }
  .next-tag { font-size: .72rem; font-weight: 700; background: var(--accent); color: var(--surface); padding: 3px 10px; border-radius: 999px; }
  .time { color: var(--muted); margin: 4px 0 18px; font-size: .95rem; }
  .role { display: flex; align-items: baseline; gap: 10px; padding: 12px 14px; margin: 0 0 6px; background: var(--bg); border-left: 3px solid var(--accent); border-radius: 2px; }
  .role .k { color: var(--muted); font-size: .88rem; }
  .role strong { font-weight: 700; }
  h4 { font-size: .85rem; color: var(--muted); font-weight: 600; margin: 20px 0 8px; }
  .team { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 6px 24px; }
  .team li { display: flex; flex-direction: column; font-weight: 500; }
  .team span { color: var(--muted); font-size: .8rem; font-weight: 400; }
  .team .vacant { color: var(--muted); font-weight: 400; font-style: italic; }
  .songs { margin: 0; padding-left: 1.5em; display: grid; gap: 4px; }
  .songs li { padding-left: 4px; }
  .songs li::marker { color: var(--accent); font-weight: 700; }
  .muted { color: var(--muted); font-size: .95rem; }
  .empty, .notice { padding: 32px 24px; border: 1px dashed var(--line); border-radius: 4px; color: var(--muted); text-align: center; background: var(--surface); }
  .notice.error { border-color: var(--danger); color: var(--danger); text-align: left; }
  .notice.error p + p { margin-top: 8px; }

  /* ---------- Buttons ---------- */
  .btn { padding: 10px 18px; border-radius: 4px; border: 1px solid var(--green); background: var(--green); color: var(--on-green); font-weight: 600; cursor: pointer; }
  .btn:hover { background: var(--green-2); }
  .btn:disabled { opacity: .55; cursor: progress; }
  .btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
  .btn.ghost:hover { border-color: var(--muted); }
  .btn.small { padding: 6px 12px; font-size: .9rem; }
  .btn.danger { background: transparent; color: var(--danger); border-color: var(--danger); }
  .mini-select { width: auto; max-width: 100%; padding: 10px 14px; font-size: .95rem; }

  /* ---------- Calendar ---------- */
  .cal-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
  .cal-head h2 { font-size: 1.9rem; }
  .cal-nav { display: flex; gap: 6px; }
  .cal-nav .btn { min-width: 44px; min-height: 44px; padding: 8px 12px; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin: 0 0 12px; color: var(--muted); font-size: .85rem; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; }
  .legend .l-serving { background: var(--green); } .legend .l-booked { background: var(--accent); } .legend .l-open { border: 1.5px solid var(--muted); }
  .cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border-top: 1px solid var(--line); border-left: 1px solid var(--line); background: var(--line); }
  .cal > * { border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .cal-dow { padding: 8px 4px; text-align: center; font-size: .78rem; color: var(--muted); font-weight: 600; background: var(--surface); }
  .cal-day { min-height: 78px; padding: 6px; text-align: left; background: var(--bg); color: var(--ink); border-top: 0; border-left: 0; display: flex; flex-direction: column; gap: 4px; align-items: flex-start; }
  .cal-day .n { font-weight: 600; font-size: .9rem; min-width: 24px; height: 24px; display: grid; place-items: center; border-radius: 50%; }
  .cal-day.out { opacity: .4; }
  .cal-day.past { opacity: .6; }
  .cal-day.has { background: var(--surface); cursor: pointer; }
  .cal-day.has:hover { background: var(--bg); }
  .cal-day.today .n { background: var(--ink); color: var(--bg); }
  .cal-day.sel { outline: 2px solid var(--accent); outline-offset: -2px; }
  .pill { font-size: .7rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; line-height: 1.4; }
  .pill.serving { background: var(--green); color: var(--on-green); }
  .pill.booked { background: var(--accent); color: var(--surface); }
  .pill.open { border: 1px solid var(--muted); color: var(--muted); font-weight: 600; }
  .pill.set { background: var(--bg); border: 1px solid var(--line); color: var(--ink); }

  .day-detail { margin-top: 28px; }
  .day-detail > h3 { font-size: 1.7rem; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
  .svc-card { padding: 20px 0; border-bottom: 1px solid var(--line); }
  .svc-top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; margin-bottom: 12px; }
  .svc-top h4 { margin: 0; font-size: 1.05rem; color: var(--ink); }
  .svc-top .muted { font-size: .9rem; }
  .book-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 16px; }
  .book-row label { font-size: .85rem; color: var(--muted); font-weight: 600; }
  .status-line { margin-top: 16px; padding: 10px 14px; background: var(--bg); border-left: 3px solid var(--accent); border-radius: 2px; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; }
  .status-line.serving { border-left-color: var(--green-2); }
  .vols { margin-top: 12px; font-size: .9rem; color: var(--muted); }
  .my-bookings { margin-top: 32px; }
  .my-bookings h3 { font-size: 1.5rem; margin-bottom: 8px; }
  .bk-row { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px 16px; padding: 12px 0; border-bottom: 1px solid var(--line); }

  .toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 12px 18px; border-radius: 6px; box-shadow: var(--shadow); z-index: 20; max-width: min(92vw, 420px); font-size: .95rem; }
  .toast[hidden] { display: none; }

  footer { margin-top: 56px; padding-top: 20px; border-top: 1px solid var(--line); color: var(--muted); font-size: .85rem; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px 16px; }
  footer .link { background: none; border: 0; color: var(--accent); cursor: pointer; padding: 0; text-decoration: underline; }
  .warn { flex-basis: 100%; }

  @media (max-width: 640px) {
    .panel { grid-template-columns: 1fr; margin-top: -36px; padding: 18px; }
    .service { grid-template-columns: 1fr; gap: 16px; padding: 22px 0; }
    .date { display: flex; gap: 10px; align-items: baseline; justify-content: flex-start; text-align: left; padding: 10px 14px; }
    .date .day { font-size: 2.1rem; margin: 0; }
    .team { grid-template-columns: 1fr; }
    .nav { display: none; }
    .caption { display: none; }
    .carousel-foot { justify-content: center; }
    .tab { flex: 1; padding: 12px 8px; }
    .cal-day { min-height: 62px; padding: 4px; }
    .pill { font-size: .62rem; padding: 1px 6px; }
  }
  @media (prefers-reduced-motion: reduce) { .slide { transition: none; } }
</style>
</head>
<body>

<header class="hero" id="hero" role="region" aria-roledescription="carousel" aria-label="Worship team photos" tabindex="0">
  <div id="slides"></div>

  <div class="topbar">
    <a class="brand" href="#" id="brand" aria-label="Victory Tacloban">
      <img id="logo" alt="Victory" hidden>
      <span class="wordmark" id="wordmark" hidden>Victory Tacloban</span>
    </a>
  </div>

  <div class="hero-text">
    <h1>Worship team schedules</h1>
    <p class="sub">Choose your name to see when you serve, who you are serving with, and the setlist for each service.</p>
  </div>

  <button class="nav prev" id="prev" type="button" aria-label="Previous photo">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
  </button>
  <button class="nav next" id="next" type="button" aria-label="Next photo">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
  </button>
  <div class="carousel-foot">
    <span class="caption" id="caption" aria-live="off"></span>
    <div class="dots" id="dots"></div>
  </div>
</header>

<main class="wrap">
  <section class="panel" aria-labelledby="pick-label">
    <div>
      <label id="pick-label" for="name">Your name</label>
      <div class="select-wrap">
        <select id="name"><option value="">Loading names…</option></select>
      </div>
    </div>
    <p class="panel-note">Names and schedules come straight from the team Google Sheet. Contact your team admin for swaps.</p>
  </section>

  <div class="tabs" role="tablist" aria-label="Views">
    <button class="tab" role="tab" id="tab-schedule" data-view="schedule" aria-selected="true" aria-controls="view">My Sunday schedule</button>
    <button class="tab" role="tab" id="tab-calendar" data-view="calendar" aria-selected="false" aria-controls="view">Calendar</button>
  </div>

  <section id="view" role="tabpanel" aria-live="polite"></section>

  <footer>
    <span id="updated">Loading from Google Sheets…</span>
    <span><button class="link" type="button" id="refresh">Refresh now</button></span>
    <span class="warn" id="warn" hidden></span>
  </footer>
</main>

<div class="toast" id="toast" role="status" hidden></div>

  vx:  /^(worship\s*leader|lead\s*vocals?|vx)$/i,
  bv1: /^back-?\s*up\s*(vx|vocals?)\s*1$/i,

/* =========================================================
   PARSING (pure functions, no DOM)
   ========================================================= */
// <parse>
const pad = n => String(n).padStart(2, '0');
const MONTHS = ['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
const isoOf = (y, m, d) => `${y}-${pad(m)}-${pad(d)}`;

function cellText(c) {
  if (!c) return '';
  if (c.f != null && String(c.f).trim() !== '') return String(c.f).trim();
  const v = c.v;
  if (v == null) return '';
  if (Array.isArray(v)) return `${v[0] % 12 || 12}:${pad(v[1] || 0)} ${v[0] >= 12 ? 'PM' : 'AM'}`;
  return String(v).trim();
}
function gvizRows(resp) {
  if (!resp || resp.status === 'error' || !resp.table) throw new Error('Google Sheets refused the request');
  return resp.table.rows.map(r => (r.c || []).map(cellText));
}
function parseDateText(s) {
  s = String(s || '').trim();
  let m = s.match(/^Date\((\d{4}),\s*(\d{1,2}),\s*(\d{1,2})/);
  if (m) return isoOf(+m[1], +m[2] + 1, +m[3]);
  m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (m) return isoOf(+m[1], +m[2], +m[3]);
  m = s.match(/^(?:[A-Za-z]+,?\s+)?([A-Za-z]{3,9})\.?\s+(\d{1,2}),?\s+(\d{4})/);
  if (m) { const i = MONTHS.indexOf(m[1].slice(0, 3).toLowerCase()); if (i >= 0) return isoOf(+m[3], i + 1, +m[2]); }
  m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if (m) return isoOf(+m[3], +m[1], +m[2]);
  return null;
}
function parseTimeText(s) {
  const m = String(s || '').match(/(\d{1,2}):(\d{2})(?::\d{2})?\s*([AaPp][Mm])?/);
  if (!m) return null;
  let h = +m[1];
  const ap = m[3] && m[3].toLowerCase();
  if (ap === 'pm' && h < 12) h += 12;
  if (ap === 'am' && h === 12) h = 0;
  return `${pad(h)}:${m[2]}`;
}
function normName(s) {
  return String(s || '').toLowerCase().replace(/['"‘’“”.]/g, '').replace(/\s+/g, ' ').trim();
}

function parseLineup(rows) {
  let hi = -1, best = 0;
  rows.forEach((r, i) => {
    const n = ROLE_ORDER.filter(k => r.some(c => ROLE_PATTERNS[k].test(c.trim()))).length;
    if (n > best) { best = n; hi = i; }
  });
  const col = { roles: {}, songs: [], date: null, time: null, label: null };
  if (best >= 3) {
    rows[hi].forEach((raw, j) => {
      const c = raw.trim();
      ROLE_ORDER.forEach(k => { if (!(k in col.roles) && ROLE_PATTERNS[k].test(c)) col.roles[k] = j; });
      if (/^song\s*\d+/i.test(c)) col.songs.push(j);
      if (col.date == null && /date/i.test(c)) col.date = j;
      if (col.time == null && /^(service\s*)?time$/i.test(c)) col.time = j;
      if (col.label == null && /^service$/i.test(c)) col.label = j;
    });
  } else {
    Object.assign(col, { roles: { eg: 4, ag: 5, dr: 6, kb: 7, bb: 8, vx: 9, bv1: 10, bv2: 11 }, songs: [12, 13, 14, 15], date: 0, label: 2, time: 3 });
    hi = -1;
  }
  const out = [];
  rows.forEach((r, i) => {
    if (i <= hi) return;
    let date = col.date != null ? parseDateText(r[col.date]) : null;
    if (!date) for (let j = 0; j < 4 && !date; j++) date = parseDateText(r[j]);
    if (!date) return;
    let time = col.time != null ? parseTimeText(r[col.time]) : null;
    if (!time) for (let j = 0; j < 6 && !time; j++) { if (parseDateText(r[j])) continue; time = parseTimeText(r[j]); }
    if (!time) return;
    const team = {};
    ROLE_ORDER.forEach(k => { team[k] = col.roles[k] != null ? String(r[col.roles[k]] || '').trim() : ''; });
    const songs = col.songs.map(j => String(r[j] || '').trim()).filter(Boolean);
    const label = (col.label != null && String(r[col.label] || '').trim()) || 'Worship Service';
    out.push({ date, time, label, team, songs });
  });
  out.sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
  return out;
}

function parseRoster(rows) {
  let nameCol = 0, start = 0, aliasCols = null, found = false;
  for (let i = 0; i < Math.min(rows.length, 10) && !found; i++) {
    const j = rows[i].findIndex(c => /^(full\s*)?name$/i.test(c.trim()));
    if (j >= 0) {
      nameCol = j; start = i + 1; found = true;
      aliasCols = rows[i].map((c, k) => (k !== j && /nick|alias|short|display|call|also|goes\s*by/i.test(c) ? k : -1)).filter(k => k >= 0);
    }
  }
  if (!found && rows[0] && /name|roster|member|team/i.test(rows[0][0] || '')) start = 1;
  const people = [], seen = new Set();
  rows.slice(start).forEach(r => {
    const name = String(r[nameCol] || '').trim();
    if (!name || seen.has(normName(name))) return;
    seen.add(normName(name));
    const aliases = (aliasCols || r.map((_, k) => k).filter(k => k !== nameCol))
      .map(k => String(r[k] || '').trim()).filter(a => a && a.length < 40);
    people.push({ name, aliases });
  });
  people.sort((a, b) => a.name.localeCompare(b.name));
  return people;
}

function makeMatcher(roster, aliasMap) {
  const exact = new Map();
  roster.forEach(p => exact.set(normName(p.name), p.name));
  roster.forEach(p => p.aliases.forEach(a => { if (!exact.has(normName(a))) exact.set(normName(a), p.name); }));
  Object.entries(aliasMap || {}).forEach(([from, to]) => { if (exact.has(normName(to))) exact.set(normName(from), exact.get(normName(to))); });
  const tokens = roster.map(p => ({ name: p.name, t: normName([p.name, ...p.aliases].join(' ')).split(' ') }));
  return function match(raw) {
    const n = normName(raw);
    if (!n) return null;
    if (exact.has(n)) return exact.get(n);
    const rt = n.split(' ');
    const hits = tokens.filter(p => rt.every(t => p.t.includes(t)));
    return hits.length === 1 ? hits[0].name : null;
  };
}

function buildServices(lineup, roster, aliasMap) {
  const match = makeMatcher(roster, aliasMap);
  const unmatched = new Set();
  const services = lineup.map(s => {
    const team = {};
    ROLE_ORDER.forEach(k => {
      const raw = s.team[k];
      const person = raw ? match(raw) : null;
      if (raw && !person) unmatched.add(raw);
      team[k] = { raw, person };
    });
    return { date: s.date, time: s.time, label: s.label, songs: s.songs, team };
  });
  return { services, unmatched: [...unmatched].sort() };
}

/* =========================================================

let jsonpCount = 0;
function jsonp(buildUrl, timeoutMs = 15000) {
  return new Promise((resolve, reject) => {
    const cb = `__sheetcb${++jsonpCount}_${Date.now()}`;
    const s = document.createElement('script');
    const done = () => { clearTimeout(timer); delete window[cb]; s.remove(); };
    const timer = setTimeout(() => { done(); reject(new Error('timeout')); }, timeoutMs);
    window[cb] = data => { done(); resolve(data); };
    s.onerror = () => { done(); reject(new Error('network')); };
    s.src = buildUrl(cb);
    document.head.appendChild(s);
  });
}
const fetchTab = tab => jsonp(cb =>
  `https://docs.google.com/spreadsheets/d/${CONFIG.SHEET_ID}/gviz/tq?headers=0&sheet=${encodeURIComponent(tab)}&tqx=out:json;responseHandler:${cb}`
).then(gvizRows);
const api = params => jsonp(cb => {
  const base = CONFIG.APPS_SCRIPT_URL;
  return `${base}${base.includes('?') ? '&' : '?'}${new URLSearchParams(params)}&callback=${cb}`;
}, 25000);

const hasTeam = svc => ROLE_ORDER.some(k => svc.team[k].raw);
const rolesOf = (svc, person) => ROLE_ORDER.filter(k => svc.team[k].person === person);
const myBookings = person => state.bookings.filter(b => b.name === person);
const bookingFor = (person, svc) => state.bookings.find(b => b.name === person && b.date === svc.date && b.time === svc.time);

function el(tag, attrs, ...kids) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') node.className = v;
    else if (k.startsWith('on')) node.addEventListener(k.slice(2), v);
    else node.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat()) {
    if (kid == null || kid === false) continue;
    node.appendChild(typeof kid === 'string' ? document.createTextNode(kid) : kid);
  }
  return node;
}

let toastTimer;
function toast(msg) {
  const t = $('toast');
  t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.hidden = true; }, 4200);
}

/* =========================================================
   LOAD + LIVE REFRESH
   ========================================================= */
async function loadAll(manual) {
  try {
    const [lineupRows, rosterRows] = await Promise.all([fetchTab(CONFIG.LINEUP_TAB), fetchTab(CONFIG.ROSTER_TAB)]);
    const roster = parseRoster(rosterRows);
    if (!roster.length) throw new Error('The Roster tab has no names');
    const { services, unmatched } = buildServices(parseLineup(lineupRows), roster, CONFIG.ALIASES);
    let bookings = state.bookings;
    if (bookingEnabled()) {
      try { const res = await api({ action: 'list' }); if (res && res.ok) bookings = res.bookings; }
      catch (e) { console.warn('Bookings could not be loaded', e); }
    }
    const sig = JSON.stringify([roster, services, bookings]);
    state.updated = new Date();
    state.unmatched = unmatched;
    const wasError = state.status !== 'ready';
    if (sig !== state.sig || wasError) {
      state.sig = sig; state.roster = roster; state.services = services; state.bookings = bookings; state.status = 'ready';
      if (state.selected && state.selected !== ALL && !roster.some(p => p.name === state.selected)) {
        state.selected = ''; lsSet('worship-person', '');
        toast('Your name is no longer on the roster. Please pick your name again.');
      }
      if (!state.pickedDate) {
        const next = services.find(s => s.date >= todayISO());
        if (next) { state.pickedDate = next.date; state.month = new Date(dateOf(next.date).getFullYear(), dateOf(next.date).getMonth(), 1); }
      }
      render();
    } else { renderFooter(); }
    if (manual) toast('Up to date with the Google Sheet.');
  } catch (e) {
    console.error(e);
    if (state.status !== 'ready') { state.status = 'error'; state.error = e.message; render(); }
    else if (manual) toast('Could not reach Google Sheets. Showing the last loaded schedule.');
  }
}

/* =========================================================
   RENDER
   ========================================================= */
function render() { renderPicker(); renderTabs(); renderView(); renderFooter(); }

function renderPicker() {
  const sel = $('name');
  const want = state.selected;
  sel.innerHTML = '';
  sel.appendChild(el('option', { value: '' }, state.status === 'loading' ? 'Loading names…' : 'Choose your name'));
  sel.appendChild(el('option', { value: ALL }, 'All Upcoming Sundays'));
  state.roster.forEach(p => sel.appendChild(el('option', { value: p.name }, p.name)));
  sel.value = want;
  if (sel.value !== want) sel.value = '';
}

function renderTabs() {
  document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-selected', String(t.dataset.view === state.view)));
}

function renderFooter() {
  $('updated').textContent = state.updated
    ? `Live from Google Sheets · updated ${state.updated.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' })}`
    : 'Loading from Google Sheets…';
  const w = $('warn');
  if (state.unmatched.length) {
    w.hidden = false;
    w.textContent = `For admins: ${state.unmatched.length === 1 ? 'this name in the Lineup tab is' : 'these names in the Lineup tab are'} not on the Roster tab, so ${state.unmatched.length === 1 ? 'it is' : 'they are'} not linked to a person: ${state.unmatched.join(', ')}.`;
  } else { w.hidden = true; }
}

function renderView() {
  const v = $('view');
  v.innerHTML = '';
  if (state.status === 'loading') { v.appendChild(el('div', { class: 'notice' }, 'Loading the latest schedule from Google Sheets…')); return; }
  if (state.status === 'error') {
    v.appendChild(el('div', { class: 'notice error' },
      el('p', null, 'The schedule could not be loaded.'),
      el('p', null, 'Check that the Google Sheet is shared as “Anyone with the link can view”, and that the tabs are named “' + CONFIG.LINEUP_TAB + '” and “' + CONFIG.ROSTER_TAB + '”.'),
      el('p', { class: 'muted' }, 'Details: ' + state.error),
      el('p', null, el('button', { class: 'btn small', type: 'button', onclick: () => { state.status = 'loading'; render(); loadAll(); } }, 'Try again'))
    ));
    return;
  }
  if (state.view === 'calendar') renderCalendar(v); else renderSchedule(v);
}

/* ---------- Schedule tab ---------- */
function renderSchedule(v) {
  const person = state.selected;
  if (!person) { v.appendChild(el('div', { class: 'empty' }, 'Choose your name above to see your upcoming services.')); return; }
  const isAll = person === ALL;
  const upcoming = state.services.filter(s => s.date >= todayISO());
  const matching = isAll ? upcoming.filter(hasTeam) : upcoming.filter(s => rolesOf(s, person).length);

  v.appendChild(el('div', { class: 'person-head' },
    el('h2', null, isAll ? 'All Upcoming Sundays' : person),
    el('span', { class: 'count' }, `${matching.length} service${matching.length === 1 ? '' : 's'}`)
  ));
  if (!isAll) renderMyBookings(v);
  if (!matching.length) {
    v.appendChild(el('div', { class: 'empty', style: 'margin-top:12px' },
      isAll ? 'No lineups have been filled in yet.' : 'You are not on an upcoming lineup yet. Open the Calendar tab to volunteer for a Sunday.'));
    return;
  }
  const firstDate = matching[0].date;
  matching.forEach(svc => {
    const dt = dateOf(svc.date);
    const mine = isAll ? [] : rolesOf(svc, person);
    const members = ROLE_ORDER.filter(k => svc.team[k].raw);
    v.appendChild(el('article', { class: 'service' },
      el('div', { class: 'date' },
        el('span', { class: 'dow' }, DOW[dt.getDay()]),
        el('span', { class: 'day' }, String(dt.getDate())),
        el('span', { class: 'mon' }, MON[dt.getMonth()])
      ),
      el('div', null,
        el('div', { class: 'service-title' },
          el('h3', null, svc.label),
          svc.date === firstDate && el('span', { class: 'next-tag' }, 'NEXT SUNDAY')
        ),
        el('p', { class: 'time' }, `${fmtLong(svc.date)} • ${fmtTime(svc.time)}`),
        mine.map(k => el('div', { class: 'role' }, el('span', { class: 'k' }, 'Your role:'), el('strong', null, ROLE_LABEL[k]))),
        el('h4', null, 'Team Lineup'),
        el('ul', { class: 'team' }, members.map(k => el('li', null, el('span', null, ROLE_LABEL[k]), svc.team[k].raw))),
        el('h4', null, 'Setlist'),
        svc.songs.length ? el('ol', { class: 'songs' }, svc.songs.map(s => el('li', null, s))) : el('p', { class: 'muted' }, 'Setlist to be announced')
      )
    ));
  });
}

/* ---------- Calendar tab ---------- */
function renderCalendar(v) {
  const person = state.selected;
  const isAll = person === ALL;
  const today = todayISO();
  const byDate = new Map();
  state.services.forEach(s => { if (!byDate.has(s.date)) byDate.set(s.date, []); byDate.get(s.date).push(s); });

  const y = state.month.getFullYear(), m = state.month.getMonth();
  const title = state.month.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
  const shift = n => { state.month = new Date(y, m + n, 1); render(); };

  v.appendChild(el('div', { class: 'cal-head' },
    el('h2', null, title),
    el('div', { class: 'cal-nav' },
      el('button', { class: 'btn ghost', type: 'button', 'aria-label': 'Previous month', onclick: () => shift(-1) }, '‹'),
      el('button', { class: 'btn ghost', type: 'button', onclick: () => { const n = new Date(); state.month = new Date(n.getFullYear(), n.getMonth(), 1); render(); } }, 'Today'),
      el('button', { class: 'btn ghost', type: 'button', 'aria-label': 'Next month', onclick: () => shift(1) }, '›')
    )
  ));
  v.appendChild(el('div', { class: 'legend' },
    el('span', null, el('i', { class: 'l-serving' }), 'You’re serving'),
    el('span', null, el('i', { class: 'l-booked' }), 'You volunteered'),
    el('span', null, el('i', { class: 'l-open' }), 'Service day')
  ));

  const grid = el('div', { class: 'cal', role: 'grid', 'aria-label': title });
  DOW.forEach(d => grid.appendChild(el('div', { class: 'cal-dow', role: 'columnheader' }, d.charAt(0) + d.slice(1).toLowerCase())));
  const first = new Date(y, m, 1);
  const cursor = new Date(y, m, 1 - first.getDay());
  const last = new Date(y, m + 1, 0);
  const total = Math.ceil((first.getDay() + last.getDate()) / 7) * 7;
  for (let i = 0; i < total; i++) {
    const d = new Date(cursor.getFullYear(), cursor.getMonth(), cursor.getDate() + i);
    const iso = isoOf(d.getFullYear(), d.getMonth() + 1, d.getDate());
    const svcs = byDate.get(iso) || [];
    const cls = ['cal-day'];
    if (d.getMonth() !== m) cls.push('out');
    if (iso < today) cls.push('past');
    if (iso === today) cls.push('today');
    if (svcs.length) cls.push('has');
    if (iso === state.pickedDate) cls.push('sel');
    let pill = null;
    if (svcs.length) {
      if (!person || isAll) pill = el('span', { class: svcs.some(hasTeam) ? 'pill set' : 'pill open' }, svcs.some(hasTeam) ? 'Lineup set' : 'Open');
      else if (svcs.some(s => rolesOf(s, person).length)) pill = el('span', { class: 'pill serving' }, 'Serving');
      else if (svcs.some(s => bookingFor(person, s))) pill = el('span', { class: 'pill booked' }, 'Volunteered');
      else pill = el('span', { class: 'pill open' }, 'Open');
    }
    const inner = [el('span', { class: 'n' }, String(d.getDate())), pill];
    grid.appendChild(svcs.length
      ? el('button', { class: cls.join(' '), type: 'button', role: 'gridcell', 'aria-label': `${fmtWeekday(iso)}, ${svcs.length} services`, 'aria-pressed': String(iso === state.pickedDate), onclick: () => { state.pickedDate = iso; render(); const dd = $('day-detail'); if (dd) dd.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); } }, inner)
      : el('div', { class: cls.join(' '), role: 'gridcell' }, inner));
  }
  v.appendChild(grid);

  if (state.pickedDate && byDate.has(state.pickedDate)) {
    const svcs = byDate.get(state.pickedDate);
    const detail = el('section', { class: 'day-detail', id: 'day-detail' }, el('h3', null, fmtWeekday(state.pickedDate)));
    if (!person) detail.appendChild(el('p', { class: 'muted', style: 'margin-top:12px' }, 'Choose your name above to volunteer for a service.'));
    else if (!isAll && !bookingEnabled()) detail.appendChild(el('p', { class: 'muted', style: 'margin-top:12px' }, 'Volunteering is not switched on yet. Ask your admin to connect it.'));
    svcs.forEach(svc => detail.appendChild(serviceCard(svc, person)));
    v.appendChild(detail);
  } else {
    v.appendChild(el('p', { class: 'muted', style: 'margin-top:16px' }, 'Select a Sunday on the calendar to see its lineup' + (bookingEnabled() ? ' and volunteer.' : '.')));
  }
  if (person && !isAll) renderMyBookings(v);
}

function serviceCard(svc, person) {
  const isAll = person === ALL;
  const mine = person && !isAll ? rolesOf(svc, person) : [];
  const myBk = person && !isAll ? bookingFor(person, svc) : null;
  const vols = state.bookings.filter(b => b.date === svc.date && b.time === svc.time);
  const open = ROLE_ORDER.filter(k => !svc.team[k].raw);
  const future = svc.date >= todayISO();
  const key = `${svc.date}|${svc.time}`;

  const card = el('article', { class: 'svc-card' },
    el('div', { class: 'svc-top' }, el('h4', null, `${fmtTime(svc.time)} · ${svc.label}`), el('span', { class: 'muted' }, hasTeam(svc) ? '' : 'Lineup not set yet')),
    el('ul', { class: 'team' }, ROLE_ORDER.map(k => el('li', null, el('span', null, ROLE_LABEL[k]),
      svc.team[k].raw ? svc.team[k].raw : el('em', { class: 'vacant' }, 'Open'))))
  );
  if (vols.length) card.appendChild(el('p', { class: 'vols' }, 'Volunteers: ' + vols.map(b => `${b.name} (${b.role || 'Any role'})`).join(', ')));

  if (!person || isAll || !bookingEnabled() && !mine.length) return card;
  if (mine.length) {
    card.appendChild(el('div', { class: 'status-line serving' }, el('span', null, `You’re serving as ${mine.map(k => ROLE_LABEL[k]).join(' and ')}.`)));
  } else if (myBk) {
    card.appendChild(el('div', { class: 'status-line' },
      el('span', null, `You volunteered (${myBk.role || 'Any role'}). Waiting for your admin to confirm.`),
      el('button', { class: 'btn small danger', type: 'button', disabled: state.busy === key, onclick: () => cancelBooking(svc) }, 'Cancel volunteering')
    ));
  } else if (future && open.length) {
    const sel = el('select', { class: 'mini-select', id: 'role-' + key.replace(/\W/g, ''), 'aria-label': 'Role' },
      el('option', { value: 'Any role' }, 'Any open role'),
      open.map(k => el('option', { value: ROLE_LABEL[k] }, ROLE_LABEL[k])));
    card.appendChild(el('div', { class: 'book-row' },
      el('span', { class: 'book-label' }, 'Role'), sel,
      el('button', { class: 'btn', type: 'button', disabled: state.busy === key, onclick: () => book(svc, sel.value) }, state.busy === key ? 'Booking…' : 'Volunteer for this service')
    ));
  } else if (future) {
    card.appendChild(el('p', { class: 'muted', style: 'margin-top:12px' }, 'Every role is filled for this service.'));
  }
  return card;
}

function renderMyBookings(v) {
  const person = state.selected;
  const list = myBookings(person).filter(b => b.date >= todayISO()).sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
  if (!list.length) return;
  const box = el('section', { class: 'my-bookings' }, el('h3', null, 'Your volunteer bookings'),
    el('p', { class: 'muted' }, 'Waiting for your admin to add you to the lineup.'));
  list.forEach(b => {
    const svc = state.services.find(s => s.date === b.date && s.time === b.time) || { date: b.date, time: b.time };
    box.appendChild(el('div', { class: 'bk-row' },
      el('span', null, `${fmtLong(b.date)} · ${fmtTime(b.time)} · ${b.role || 'Any role'}`),
      el('button', { class: 'btn small danger', type: 'button', onclick: () => cancelBooking(svc) }, 'Cancel')));
  });
  v.appendChild(box);
}

/* ---------- Booking actions ---------- */
async function book(svc, role) {
  const key = `${svc.date}|${svc.time}`;
  state.busy = key; renderView();
  try {
    const res = await api({ action: 'book', name: state.selected, date: svc.date, time: svc.time, role });
    if (!res || !res.ok) throw new Error((res && res.error) || 'Booking failed');
    state.bookings = res.bookings; state.sig = '';
    toast('You’re booked. Your admin will confirm you in the lineup.');
  } catch (e) { toast('Could not book: ' + e.message); }
  state.busy = ''; render();
}
async function cancelBooking(svc) {
  if (!confirm('Cancel this volunteer booking?')) return;
  try {
    const res = await api({ action: 'cancel', name: state.selected, date: svc.date, time: svc.time });
    if (!res || !res.ok) throw new Error((res && res.error) || 'Cancel failed');
    state.bookings = res.bookings; state.sig = '';
    toast('Booking cancelled.');
  } catch (e) { toast('Could not cancel: ' + e.message); }
  render();
}

/* ---------- Events ---------- */
$('name').addEventListener('change', e => { state.selected = e.target.value; lsSet('worship-person', state.selected); render(); });
document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => { state.view = t.dataset.view; render(); }));
$('refresh').addEventListener('click', () => loadAll(true));
document.addEventListener('visibilitychange', () => { if (!document.hidden) loadAll(); });
setInterval(() => { if (!document.hidden) loadAll(); }, CONFIG.REFRESH_MS);

/* =========================================================
   LOGO
   ========================================================= */
(function initLogo() {
  const img = $('logo'), word = $('wordmark');
  const showWord = () => { img.hidden = true; word.hidden = false; };
  if (!CONFIG.LOGO_URL) { showWord(); return; }
  img.onerror = showWord;
  img.onload = () => { img.hidden = false; word.hidden = true; };
  img.src = CONFIG.LOGO_URL;
})();

/* =========================================================
   CAROUSEL
   ========================================================= */
(function initCarousel() {
  const hero = $('hero'), wrap = $('slides'), dots = $('dots'), caption = $('caption');
  let i = 0, timer = null;
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const slideEls = SLIDES.map((s, n) => {
    const node = el('div', { class: 'slide' + (n === 0 ? ' on' : ''), role: 'group', 'aria-roledescription': 'slide', 'aria-label': `${n + 1} of ${SLIDES.length}` },
      el('img', { src: s.src, alt: s.alt, loading: n === 0 ? 'eager' : 'lazy' }));
    wrap.appendChild(node);
    return node;
  });
  const dotEls = SLIDES.map((s, n) => {
    const b = el('button', { class: 'dot', type: 'button', 'aria-label': `Show photo ${n + 1}`, onclick: () => { show(n); restart(); } });
    dots.appendChild(b);
    return b;
  });
  function show(n) {
    i = (n + SLIDES.length) % SLIDES.length;
    slideEls.forEach((s, k) => s.classList.toggle('on', k === i));
    dotEls.forEach((d, k) => d.setAttribute('aria-current', String(k === i)));
    caption.textContent = SLIDES[i].caption || '';
  }
  function stop() { clearInterval(timer); timer = null; }
  function start() { if (reduce || SLIDES.length < 2) return; stop(); timer = setInterval(() => show(i + 1), 6000); }
  function restart() { stop(); start(); }
  $('prev').addEventListener('click', () => { show(i - 1); restart(); });
  $('next').addEventListener('click', () => { show(i + 1); restart(); });
  hero.addEventListener('mouseenter', stop);
  hero.addEventListener('mouseleave', start);
  hero.addEventListener('focusin', stop);
  hero.addEventListener('focusout', start);
  hero.addEventListener('keydown', e => { if (e.key === 'ArrowLeft') { show(i - 1); } else if (e.key === 'ArrowRight') { show(i + 1); } });
  let x0 = null;
  hero.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; stop(); }, { passive: true });
  hero.addEventListener('touchend', e => {
    if (x0 != null) { const dx = e.changedTouches[0].clientX - x0; if (Math.abs(dx) > 40) show(i + (dx < 0 ? 1 : -1)); }
    x0 = null; start();
  });
  if (SLIDES.length < 2) { $('prev').hidden = true; $('next').hidden = true; dots.hidden = true; }
  show(0); start();
})();

/* ---------- Go ---------- */
render();
loadAll();
</script>
